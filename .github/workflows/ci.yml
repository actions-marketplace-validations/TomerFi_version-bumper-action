---
name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - '.dist/**'
      - 'action.js'
      - 'action.yml'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4  # v1.84.1
      - name: Set up editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393  # v.3.0.0

      - name: Ensure assistant files are linked
        uses: tomerfi/aicfg/link@bb75b6201a3670b56ae94cf86cd0a8103122a488 # 0.2.1
        with:
          source: agents
          target: claude-code

  test:
    needs: lint
    uses: ./.github/workflows/test_action.yml
